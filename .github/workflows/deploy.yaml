name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Atualizar projeto
        run: |
          cd /home/sks/DevShowcase
          git pull origin main

      - name: Rebuild Docker
        run: |
          cd /home/sks/DevShowcase
          docker-compose down
          docker-compose up -d --build