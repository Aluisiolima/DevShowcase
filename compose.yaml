services:
  devshowcase:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: devshowcase

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./src:/app/src

    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: devshowcase-postgres

    environment:
      POSTGRES_USER: devshowcase
      POSTGRES_PASSWORD: devshowcase
      POSTGRES_DB: devshowcase

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

volumes:
  postgres_data: